<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo | Carolina Flores Porras</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="description" content="Productos de entrega Inmediata: BetterWare, Home Interiors, ropa y calzado.">
<meta property="og:type" content="website">
<meta property="og:title" content="Catálogo · Entrega Inmediata">
<meta property="og:description" content="Mira los productos disponibles y pregunta por WhatsApp.">
<meta property="og:image" content="https://dieflo04.github.io/catalogo-productos/images/preview.jpg">
<meta property="og:url" content="https://dieflo04.github.io/catalogo-productos/">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
  <div class="titulo">
    <h1>Entrega Inmediata</h1>
    <div class="der"><span>Distribuidora: Carolina Flores Porras</span><button id="btn-fav" aria-label="Ver favoritos">♥<b id="cuenta-fav" class="hidden">0</b></button>
    <button id="btn-carrito" aria-label="Ver mi pedido">🛒<b id="cuenta" class="hidden">0</b></button></div>
  </div>
  <input id="buscar" type="search" placeholder="Buscar producto o ID…">
  <nav id="marcas"></nav>
  <nav id="cats" class="cats hidden"></nav>
  <div id="filtros" class="filtros">
    <input id="pmin" type="number" inputmode="numeric" min="0" placeholder="Precio mín">
    <input id="pmax" type="number" inputmode="numeric" min="0" placeholder="Precio máx">
    <select id="talla" class="hidden"><option value="">Todas las tallas</option></select>
    <select id="orden">
      <option value="">Ordenar</option>
      <option value="asc">Precio: menor a mayor</option>
      <option value="desc">Precio: mayor a menor</option>
    </select>
  </div>
</header>

<main>
  <p id="estado" class="aviso">Cargando productos…</p>
  <div id="grid" class="grid"></div>
  <div id="mas" class="mas hidden"><button id="btn-mas">Ver más productos</button></div>
</main>

<a href="#" id="wa-float" class="whatsapp-float" target="_blank" aria-label="WhatsApp">
  <img src="images/whatsapp.webp" alt="WhatsApp">
</a>

<div id="carrito" class="carrito hidden">
  <div class="panel">
    <div class="cab"><h2>Tu pedido</h2><button id="cerrar-carrito" aria-label="Cerrar">&times;</button></div>
    <div id="items"></div>
    <div class="pie">
      <p class="total">Total: <b id="total">$0</b></p>
      <p id="nota" class="nota"></p>
      <a id="enviar" class="btn-whatsapp grande" target="_blank" rel="noopener">Enviar pedido por WhatsApp</a>
      <button id="vaciar" class="link">Vaciar pedido</button>
    </div>
  </div>
</div>

<div id="modal" class="modal hidden">
  <span class="close">&times;</span>
  <img id="modal-img" alt="">
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
